<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;background:#11111b}
  body{font-family:'Helvetica Neue',Arial,sans-serif;color:#cdd6f4;user-select:none}
  .win{position:absolute;inset:0;background:linear-gradient(160deg,#151522 0%,#1e1e2e 45%,#0f0f13 100%);overflow:hidden}
  .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;pointer-events:none;background:#a6e3a1}
  .bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(30,30,46,.6);border-bottom:1px solid rgba(148,153,203,.12)}
  .dot{width:11px;height:11px;border-radius:50%}
  .panel{position:absolute;top:62px;left:30px;right:30px;bottom:66px;background:rgba(41,42,60,.72);border:1px solid rgba(148,153,203,.18);border-radius:16px;padding:26px 30px;overflow:hidden}
  .ph{display:flex;align-items:center;gap:14px}
  .back{width:34px;height:34px;border-radius:9px;background:rgba(49,50,68,.9);border:1px solid rgba(148,153,203,.2);display:flex;align-items:center;justify-content:center;font-size:15px;color:#a6adc8}
  .searcher{position:relative;flex:1;height:36px;display:flex;align-items:center;gap:8px;background:rgba(49,50,68,.9);border:1px solid rgba(148,153,203,.25);border-radius:9px;padding:0 12px;max-width:520px}
  .caret{position:absolute;right:10px;width:8px;height:16px;background:#b4befe;border-radius:2px;opacity:0}
  .searchtext{font-size:14px;color:#e9e9f0;letter-spacing:.01em}
  .filters{display:flex;gap:8px;margin-left:auto}
  .fchip{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#a6adc8;border:1px solid rgba(148,153,203,.25);border-radius:999px;padding:6px 12px}
  .fchip.on{color:#b4befe;border-color:rgba(180,190,254,.55);background:rgba(114,135,253,.18)}
  .ghead{margin:22px 0 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a6adc8}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .tile{border-radius:12px;background:rgba(30,30,46,.9);border:1px solid rgba(148,153,203,.14);overflow:hidden;opacity:0}
  .tile .thumb{height:104px;display:flex;align-items:center;justify-content:center;font-size:40px}
  .tile .meta{padding:12px}
  .tile .tn{font-size:13.5px;font-weight:700;color:#e9e9f0}
  .tile .td{font-size:11px;color:#a6adc8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .by{margin-top:8px;display:flex;gap:6px;align-items:center}
  .ver{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a6adc8;background:rgba(49,50,68,.9);border-radius:5px;padding:2px 6px}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:rgba(249,226,175,.18);color:#f9e2af;border-radius:5px;padding:2px 6px}
  .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(148,153,203,.15)}
  .progress i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7287fd,#a6e3a1);border-radius:2px}
  .toast{position:absolute;right:24px;bottom:24px;display:flex;align-items:center;gap:10px;background:rgba(30,30,46,.96);border:1px solid rgba(166,227,161,.45);border-radius:12px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(12px)}
  .fbtn{width:34px;height:34px;border-radius:9px;background:rgba(49,50,68,.9);border:1px solid rgba(148,153,203,.2);display:flex;align-items:center;justify-content:center;font-size:15px}
  .footer{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(30,30,46,.82);border-top:1px solid rgba(148,153,203,.12)}
  .beat{display:flex;align-items:flex-end;gap:2px;height:26px}
  .beat i{width:3px;background:#a6e3a1;border-radius:2px}
</style>
</head>
<body>
<div class="win">
  <div class="glow" style="width:480px;height:480px;right:-120px;top:60px"></div>
  <div class="bar">
    <span class="dot" style="background:#f38ba8"></span>
    <span class="dot" style="background:#f9e2af"></span>
    <span class="dot" style="background:#a6e3a1"></span>
  </div>
  <div class="panel">
    <div class="ph">
      <button class="back">←</button>
      <div class="searcher"><span style="font-size:13px;color:#a6adc8">&#128269;</span><span class="searchtext" id="searchtext"></span><span class="caret" id="caret"></span></div>
      <div class="filters">
        <span class="fchip on">All</span>
        <span class="fchip">Forge</span>
        <span class="fchip">Fabric</span>
        <span class="fchip">NeoForge</span>
      </div>
    </div>
    <div class="ghead" id="ghead">Mods matching “sodium” · 48 results</div>
    <div class="grid" id="grid"></div>
    <div class="progress" id="progress"><i id="pbar"></i></div>
    <div class="toast" id="toast"><span style="font-size:16px">✔</span><span style="font-size:13px;color:#a6e3a1;font-weight:700">Installed sodium 0.6.10</span></div>
  </div>
  <div class="footer">
    <div class="beat" id="beat"></div>
  </div>
</div>
<script>
  var beat=document.getElementById('beat');
  for(var i=0;i<44;i++){var b=document.createElement('i');b.style.height='3px';beat.appendChild(b);}
  var bars=beat.children;
  var packs=[
    {n:'Sodium',d:'Rendering engine mod which greatly improves frame rates and stutter',e:'⚡',bg:'rgba(249,226,175,.2)'},
    {n:'Lithium',d:'No-compromises game logic optimization mod',e:'🧪',bg:'rgba(180,190,254,.2)'},
    {n:'Iris',d:'Shader mod with modern rendering pipeline support',e:'🌈',bg:'rgba(243,139,168,.2)'},
    {n:'Continuity',d:'Connected textures and emissive blocks',e:'🧩',bg:'rgba(166,227,161,.2)'},
    {n:'Sodium Extra',d:'Extra options for Sodium',e:'⚙️',bg:'rgba(147,153,178,.2)'},
    {n:'Indium',d:'Sodium addon providing support for the Fabric Rendering API',e:'🧱',bg:'rgba(116,199,236,.2)'},
    {n:'Mod Menu',d:'Adds an easy to use mod menu',e:'📦',bg:'rgba(137,180,250,.2)'},
    {n:'C2ME',d:'Concurrent chunk management engine',e:'🌍',bg:'rgba(166,227,161,.2)'},
    {n:'FerriteCore',d:'Memory usage optimizations',e:'🗜️',bg:'rgba(245,194,231,.2)'},
    {n:'Very Many Players',d:'Improves server performance at high playercounts',e:'👥',bg:'rgba(148,226,213,.2)'},
  ];
  var grid=document.getElementById('grid');
  packs.forEach(function(pk,idx){
    var t=document.createElement('div');t.className='tile';t.id='t'+idx;
    var th=document.createElement('div');th.className='thumb';th.style.background=pk.bg;th.textContent=pk.e;
    var m=document.createElement('div');m.className='meta';
    m.innerHTML='<div class="tn"></div><div class="td"></div><div class="by"><span class="ver">0.6.10</span><span class="tag">Fabric</span></div>';
    t.appendChild(th);t.appendChild(m);
    var qn=t.querySelector('.tn'),qd=t.querySelector('.td');
    var qnLen=pk.n.length;
    qn.textContent=pk.n;qd.textContent=pk.d;
    t.dataset.qn=qnLen;t.dataset.qd=pk.d.length;
    grid.appendChild(t);
  });
  var tiles=grid.children;
  var searchtext=document.getElementById('searchtext');
  var caret=document.getElementById('caret');
  var pbar=document.getElementById('pbar');
  var progress=document.getElementById('progress');
  var toast=document.getElementById('toast');
  function easeOut(t){t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,3);}
  function lcn(t){return t=Math.min(1,Math.max(0,t)),1-Math.pow(1-t,3);}
  window.render=function(p){
    p=((p%1)+1)%1;
    // typing "sodium"
    var typed="sodium";
    var charP=(p%1)<0.18?(p/0.18):1;
    var chars=Math.floor(charP*typed.length);
    searchtext.textContent=typed.slice(0,chars);
    caret.style.opacity=String((p<0.18||p>0.9)?((Math.sin(p*40)>0)?1:0):0);
    // tiles: fade in from top with stagger, partial at char reveal; some pop after install ~0.62
    for(var i=0;i<tiles.length;i++){
      var t0=lcn((p-0.04-i*0.028-0.05)/0.3);
      var t=tiles[i];
      t.style.opacity=String(0.25+0.75*Math.min(1,Math.max(0,t0)));
      t.style.transform='translateY('+((1-Math.min(1,Math.max(0,t0)))*14).toFixed(1)+'px)';
      t.style.background=i===0&&p>0.5?'rgba(30,30,46,.95)':'';
      t.style.borderColor=i===0&&p>0.5?'rgba(166,227,161,.5)':'';
      t.style.boxShadow=i===0&&p>0.5?'0 0 0 1px rgba(166,227,161,.35), 0 8px 22px rgba(0,0,0,.4)':'';
    }
    // install progress bar on highlighted tile
    if(p>0.5){
      progress.style.opacity='1';
      var f=lcn((p-0.5)/0.12);
      pbar.style.width=(100*f).toFixed(1)+'%';
    } else { progress.style.opacity='0'; pbar.style.width='0%'; }
    // toast
    var to=0;
    if(p>0.63){to=lcn((p-0.63)/0.08);}
    toast.style.opacity=String(to);
    toast.style.transform='translateY('+((1-to)*12).toFixed(1)+'px)';
    for(var i=0;i<bars.length;i++){
      var v=(Math.sin(i*0.5+p*Math.PI*2)+Math.sin(i*1.7+p*5.3)*0.6+2)*2.4*0.5+2;
      bars[i].style.height=(2+Math.max(0,v)*3.4).toFixed(1)+'px';
    }
  };
  render(0);
</script>
</body>
</html>
